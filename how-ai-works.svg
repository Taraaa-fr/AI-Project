<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="t d">
  <title id="t">How AI works</title>
  <desc id="d">Four steps: sees examples, finds patterns, makes a guess, a human checks.</desc>
  <style>
    .b{fill:#ffffff;stroke:#111;stroke-width:3}
    .h{fill:#ffd23f;stroke:#111;stroke-width:3}
    .n{font:700 34px "Space Grotesk",Arial,sans-serif;fill:#111}
    .l{font:600 19px Inter,Arial,sans-serif;fill:#111}
    .a{stroke:#111;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect class="b" x="10" y="20" width="160" height="160" rx="24"/>
  <text class="n" x="90" y="85" text-anchor="middle">1</text>
  <text class="l" x="90" y="122" text-anchor="middle">Sees</text><text class="l" x="90" y="146" text-anchor="middle">examples</text>
  <rect class="b" x="220" y="20" width="160" height="160" rx="24"/>
  <text class="n" x="300" y="85" text-anchor="middle">2</text>
  <text class="l" x="300" y="122" text-anchor="middle">Finds</text><text class="l" x="300" y="146" text-anchor="middle">patterns</text>
  <rect class="b" x="430" y="20" width="160" height="160" rx="24"/>
  <text class="n" x="510" y="85" text-anchor="middle">3</text>
  <text class="l" x="510" y="122" text-anchor="middle">Makes</text><text class="l" x="510" y="146" text-anchor="middle">a guess</text>
  <rect class="h" x="640" y="20" width="150" height="160" rx="24"/>
  <text class="n" x="715" y="85" text-anchor="middle">4</text>
  <text class="l" x="715" y="122" text-anchor="middle">A human</text><text class="l" x="715" y="146" text-anchor="middle">checks</text>
  <path class="a" d="M175 100H214"/><path class="a" d="M385 100H424"/><path class="a" d="M595 100H634"/>
</svg>
